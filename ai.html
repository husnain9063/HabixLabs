<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask AI — Habix Labs</title>
<meta name="description" content="Chat with the Habix Labs AI assistant." />
<link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body class="h-full">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow-up-right" viewBox="0 0 256 256"><path fill="currentColor" d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 256 256"><path fill="currentColor" d="M205.66,101.66a8,8,0,0,1-11.32,0L136,43.31V216a8,8,0,0,1-16,0V43.31L61.66,101.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0l72,72A8,8,0,0,1,205.66,101.66Z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 256 256"><path fill="currentColor" d="M208,144a8,8,0,0,1-8,8,32,32,0,0,0-32,32,8,8,0,0,1-16,0,32,32,0,0,0-32-32,8,8,0,0,1,0-16,32,32,0,0,0,32-32,8,8,0,0,1,16,0,32,32,0,0,0,32,32A8,8,0,0,1,208,144ZM120,56a24,24,0,0,0,24,24,8,8,0,0,1,0,16,24,24,0,0,0-24,24,8,8,0,0,1-16,0,24,24,0,0,0-24-24,8,8,0,0,1,0-16,24,24,0,0,0,24-24,8,8,0,0,1,16,0Z"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 256 256"><path fill="currentColor" d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></symbol>
</svg>

<div class="rays" style="position:fixed"></div>

<div class="relative flex flex-col h-screen">
  <!-- ============ TOP BAR ============ -->
  <header class="shrink-0">
    <div class="wrap flex items-center justify-between h-20">
      <a href="index.html" class="flex items-center gap-2.5 shrink-0" aria-label="Back to Habix Labs">
        <img src="/logo-mark.png" alt="" class="w-7 h-7" width="288" height="289" />
        <span class="font-display font-bold text-base tracking-tight hidden sm:inline">Habix Labs</span>
      </a>
      <a href="index.html" class="btn-dark-outline !py-2 !px-3.5">
        <svg class="w-3.5 h-3.5"><use href="#i-arrow-left"/></svg> Back to site
      </a>
    </div>
  </header>

  <!-- ============ CHAT ============ -->
  <main class="relative flex-1 min-h-0 flex flex-col">
    <div id="chat-scroll" class="chat-scroll flex-1 min-h-0 overflow-y-auto">
      <div class="wrap max-w-3xl py-8 flex flex-col gap-5">

        <div id="chat-empty" class="text-center py-16">
          <span class="eyebrow-pill">
            <svg class="w-3 h-3"><use href="#i-spark"/></svg> Ask AI
          </span>
          <h1 class="mt-6 font-display font-bold text-4xl md:text-5xl tracking-tight">What can I help you build?</h1>
          <p class="mt-4 max-w-[46ch] mx-auto" style="color:var(--color-dim)">
            Ask about our services, your project, or anything else — this assistant is happy to help with whatever's on your mind.
          </p>
        </div>

        <div id="chat-log" class="flex flex-col gap-5"></div>
      </div>
    </div>

    <!-- ============ INPUT ============ -->
    <div class="shrink-0">
      <div class="wrap max-w-3xl pb-6 md:pb-8 pt-2">
        <form id="chat-form" class="chat-input-bar">
          <textarea
            id="chat-input"
            class="chat-textarea"
            rows="1"
            placeholder="Ask anything…"
            aria-label="Message"
          ></textarea>
          <button type="submit" id="chat-send" class="chat-send" aria-label="Send message" disabled>
            <svg class="w-4 h-4"><use href="#i-arrow-up"/></svg>
          </button>
        </form>
        <p class="mt-3 text-center font-mono text-[11px] uppercase tracking-[0.06em]" style="color:var(--color-faint)">
          AI can make mistakes. Verify important information.
        </p>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/src/ai.js"></script>
</body>
</html>
